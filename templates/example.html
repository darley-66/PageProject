<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Data with Roots</title>
  <!-- 1. Estilos de Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Contenedor principal: Divide la pantalla en 2 partes (Menú y Contenido) -->
  <div class="d-flex">

    <!-- PARTE 1: Menú Lateral (Ancho de 250px y fondo oscuro) -->
    <div class="bg-dark text-white p-3" style="width: 250px; min-height: 100vh;">
      
      <h4>Data with Roots</h4>
      <hr>

      <!-- Lista de Enlaces -->
      <ul class="nav nav-pills flex-column">
        
        <!-- Inicio -->
        <li class="nav-item">
          <a href="{{ url_for('home') }}" class="nav-link text-white">Inicio</a>
        </li>

        <!-- Sección Machine Learning -->
        <li class="mt-3 text-muted small fw-bold">MACHINE LEARNING</li>
        <li>
          <a href="{{ url_for('ml_conceptos') }}" class="nav-link text-white">Conceptos</a>
        </li>
        <li>
          <a href="{{ url_for('ml_tipos') }}" class="nav-link text-white">Tipos de ML</a>
        </li>

        <!-- Sección Casos de Uso -->
        <li class="mt-3 text-muted small fw-bold">CASOS DE USO</li>
        <li><a href="{{ url_for('caso_1') }}" class="nav-link text-white">Caso 1</a></li>
        <li><a href="{{ url_for('caso_2') }}" class="nav-link text-white">Caso 2</a></li>
        <li><a href="{{ url_for('caso_3') }}" class="nav-link text-white">Caso 3</a></li>
        <li><a href="{{ url_for('caso_4') }}" class="nav-link text-white">Caso 4</a></li>

        <!-- Sección Regresión Lineal -->
        <li class="mt-3 text-muted small fw-bold">REGRESIÓN LINEAL</li>
        <li>
          <a href="{{ url_for('regresion_conceptos') }}" class="nav-link text-white">Conceptos</a>
        </li>
        <li>
          <a href="{{ url_for('regresion_aplicacion') }}" class="nav-link text-white">Aplicación</a>
        </li>

      </ul>
    </div>

    <!-- PARTE 2: Área donde se cargará el contenido de las otras páginas -->
    <div class="p-4 w-100">
      {% block content %}
      <!-- El contenido de cada página se inyecta aquí -->
      {% endblock %}
    </div>

  </div>

</body>
</html>
